[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-similarity-face-verification"
version = "0.1.0"
description = "Traditional machine-learning baselines for face verification under high identity similarity"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "matplotlib>=3.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

